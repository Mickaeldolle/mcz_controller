<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon poêle · MCZ Musa</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="connection" id="connection">Connexion à l’ESP32…</span><span class="local">USB · LOCAL</span></header>
    <section aria-labelledby="title">
      <h1 id="title">Mon poêle</h1>
      <p class="model">MCZ Musa</p>
      <p class="state">État du poêle non confirmé</p>
      <div class="actions" aria-label="Commandes du poêle">
        <button id="on" class="on" disabled>
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v12M9 8a11 11 0 1 0 14 0"/></svg>
          <span>Allumer</span>
        </button>
        <button id="off" class="off" disabled>
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="8" width="16" height="16" rx="2"/></svg>
          <span>Éteindre</span>
        </button>
      </div>
      <div class="feedback" role="status" aria-live="polite" aria-atomic="true"><p id="feedback">Vérification de la connexion USB…</p></div>
    </section>
    <footer>Un envoi radio ne confirme pas la réception par le poêle.</footer>
  </main>
</body>
</html>
