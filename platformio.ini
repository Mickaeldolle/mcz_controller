[platformio]
default_envs = esp32dev
core_dir = .platformio

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts =
    pre:tools/build_profiles.py
    pre:tools/embed_web.py
build_flags =
    -Wall
    -Wextra
    -DMCZ_WIRING_CONFIRMED=1

[env:esp32dev-alexa]
extends = env:esp32dev
extra_scripts =
    ${env:esp32dev.extra_scripts}
    pre:tools/patch_fauxmo.py
build_flags =
    ${env:esp32dev.build_flags}
    -DMCZ_ALEXA_TEST=1
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.3.4
    https://github.com/vintlabs/fauxmoESP.git#3.4.1

[env:esp32dev-alexa-radio]
extends = env:esp32dev-alexa
build_flags =
    ${env:esp32dev-alexa.build_flags}
    -DMCZ_ALEXA_RADIO=1

[env:esp32dev-alexa-temperature]
extends = env:esp32dev-alexa-radio
build_flags =
    ${env:esp32dev-alexa-radio.build_flags}
    -DMCZ_TEMPERATURE_DISPLAY=1
    -DMCZ_OTA=1
lib_deps =
    ${env:esp32dev-alexa.lib_deps}
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit SSD1306@2.5.15
