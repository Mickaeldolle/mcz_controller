[platformio]
default_envs = esp32dev
core_dir = .platformio

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts =
    pre:tools/build_profiles.py
    pre:tools/embed_web.py
build_flags =
    -Wall
    -Wextra
    -DMCZ_WIRING_CONFIRMED=1

